<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvR9gXkI7JOGa2XVsw53Yke2bsdkBbjmmiX"
      crossorigin="anonymous"
    />
    <title>Contact</title>
  </head>
  <body class="bg-light m-3 pb-5">
    <nav class="navbar bg-body-tertiary">
      <div class="container-lg justify-content-start">
        <a class="navbar-brand" href="../index.html">Home</a>
        <a class="navbar-brand" href="products.html">Products</a>
        <a class="navbar-brand" href="about.html">About</a>
        <a class="navbar-brand" href="contact.html">Contact</a>
      </div>
    </nav>
    <h1>Contact Us</h1>
    <form>
      <div class="mb-3">
        <label for="fullName" class="form-label">Full Name</label>
        <input
          type="text"
          class="form-control"
          id="fullName"
          aria-describedby="fullNameHelp"
        />
        <div id="fullNameHelp" class="form-text">So we can contact you.</div>
      </div>
      <div class="mb-3">
        <label for="exampleFeedback" class="form-label">Message for us</label>
        <textarea class="form-control" id="exampleFeedback" rows="4"></textarea>
      </div>
      <button type="submit" class="btn btn-primary">Submit</button>
    </form>
  </body>
  <footer class="fixed-bottom bg-light text-center py-3">
    <a><p>&copy; 2002 Our Company. All rights reserved.</p></a>
  </footer>
</html>
